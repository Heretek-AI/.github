name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  hygiene:
    uses: $/.github/workflows/hygiene.yml
    with:
      audit_workflows: true
      exclude: |
        docs/evidence
        docs/reports

  lint:
    name: Labels and scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate labels.json schema
        run: |
          jq -e 'type == "array" and all(.[]; (.name | type == "string") and (.color | test("^[0-9a-f]{6}$")) and (.description | type == "string"))' labels.json

      - name: Validate fleet-manifest.json schema (v2)
        run: |
          jq -e '
            .schema_version == 2
            and (.organization | type == "string")
            and (.profiles | type == "object")
            and (.repositories | type == "array")
            and (.forks | type == "array")
            and (.archive_candidates | type == "array")
            and all(.repositories[];
              (.name | type == "string")
              and (.tier == 1 or .tier == 2)
              and (.profile | type == "string")
              and (.actions_enabled | type == "boolean")
              and (.protected_ruleset | type == "boolean")
              and (.self_hosted_runner | type == "boolean")
              and ((.self_hosted_runner == false) or (.actions_enabled == true))
            )
          ' fleet-manifest.json
          # Ensure every referenced lefthook template exists on disk
          while IFS= read -r tpl; do
            test -f "$tpl"
          done < <(jq -r '.profiles[].lefthook_template' fleet-manifest.json)

      - name: Validate org-actions-allowlist.json
        run: |
          jq -e '
            .schema_version == 1
            and (.github_owned_allowed | type == "boolean")
            and (.verified_allowed | type == "boolean")
            and (.patterns_allowed | type == "array")
            and all(.patterns_allowed[]; type == "string")
          ' org-actions-allowlist.json

      - name: Validate JSON templates
        run: |
          jq -e '.schema_version == 1 and (.profiles | type == "object") and (.profiles[.default_profile] | type == "object")' llm-profiles.json >/dev/null
          for f in templates/rulesets/*.json; do
            [ -f "$f" ] && jq empty "$f"
          done

      - name: Validate Agent Skills (SKILL.md)
        run: bash scripts/validate-skills.sh

      - name: ShellCheck scripts
        run: shellcheck scripts/*.sh

      - name: Python syntax check
        run: python3 -m py_compile scripts/*.py
