name: Organization Governance Drift Audit

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    name: Audit org security and fleet drift
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check for ORG_SYNC_TOKEN
        id: check-token
        env:
          SYNC_TOKEN: ${{ secrets.ORG_SYNC_TOKEN }}
        run: |
          if [ -n "$SYNC_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run organization drift audit
        env:
          GH_TOKEN: ${{ secrets.ORG_SYNC_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/audit_org.py --format markdown > drift-report.md
          cat drift-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Update tracking issue when drift audit completes
        if: steps.check-token.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          title="chore(governance): weekly organization drift audit"
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --repo "$GITHUB_REPOSITORY" --body-file drift-report.md >/dev/null
            echo "Updated tracking issue #$existing"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file drift-report.md --label "audit" >/dev/null
            echo "Created new governance drift tracking issue"
          fi
