name: Switch Organization LLM Profile

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Named LLM profile from llm-profiles.json"
        type: choice
        required: true
        default: "openrouter-ernie-free"
        options:
          - openrouter-ernie-free
          - xiaomimimo-flash
          - opencode-muse-spark
      dry_run:
        description: "Preview variable updates without modifying org variables"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  switch-llm:
    name: Apply organization LLM profile
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Apply LLM profile to Heretek-AI org variables
        env:
          GH_TOKEN: ${{ secrets.ORG_SYNC_TOKEN || secrets.GITHUB_TOKEN }}
          PROFILE: ${{ inputs.profile }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          args=()
          if [ "$DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          fi
          bash scripts/set-llm-profile.sh "${args[@]}" "$PROFILE"
