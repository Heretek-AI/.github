name: Code Quality

concurrency:
  group: code-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  code-quality:
    uses: Heretek-AI/.github/.github/workflows/code-quality.yml@0000000000000000000000000000000000000000 # main
    with:
      blocking: false
